title: Customer Support Automation System
category: AI Automation
description: LLM-powered support system that generates response suggestions for customer service agents. Reviewers use the ticket history and help-center guidance to check each draft before sending.
tech:
  - n8n
  - Claude API
  - Zendesk API
  - OpenAI
slug: "zendesk-draft-review"
context: "Customer support"
approach: "A support agent answering a follow-up needs the history of the ticket as well as the current help article. I built an n8n workflow that gathered both before drafting a reply in Zendesk."
outcome: "Support agents reviewed each draft before sending it. I compared their edits with the original replies to distinguish missing context from problems with the wording or the source article."
