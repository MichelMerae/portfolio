title: Email Coaching Automation
category: AI Content Generation
description: Automated system that generates thousands of personalized career coaching emails with A/B testing, utilizing OpenAI o3/o4 models and Microsoft Graph API.
tech:
  - OpenAI
  - n8n
  - MS Graph API
image: "https://images.unsplash.com/photo-1557200134-90327ee9fafa?auto=format&fit=crop&q=80"
slug: "personalized-email"
context: "Career coaching"
approach: "I connected onboarding and résumé information with relevant job matches, then used n8n to generate a coaching email that explained why a role might fit."
outcome: "I compared email variants using clicks on job links. Explaining more of the search process sounded helpful, but the variant with the extra explanation attracted fewer clicks. That informed the next revision."
